name: Fan and light switch
products:
  - id: tqfl5ws2csdtdaak
    manufacturer: Avatto
    model: SYS-FL01
entities:
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: string
        name: speed
        mapping:
          - dps_val: "1"
            value: 20
          - dps_val: "2"
            value: 40
          - dps_val: "3"
            value: 60
          - dps_val: "4"
            value: 80
          - dps_val: "5"
            value: 100
  - entity: light
    dps:
      - id: 9
        type: boolean
        name: switch
  - entity: number
    translation_key: timer
    category: config
    class: duration
    dps:
      - id: 6
        name: value
        type: integer
        unit: h
        range:
          min: 0
          max: 6
  - entity: sensor
    translation_key: time_remaining
    category: diagnostic
    class: duration
    dps:
      - id: 7
        name: sensor
        type: integer
        unit: min
